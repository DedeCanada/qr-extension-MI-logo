<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="wrap">
    <div class="qr-frame">
      <canvas id="qrCanvas" width="320" height="320"></canvas>
    </div>

    <textarea
      class="url-input"
      id="urlInput"
      rows="2"
      spellcheck="false"
      autocomplete="off"
      placeholder="Enter a URL"></textarea>

    <button class="size-btn" id="sizeBtn" type="button">
      <span class="size-label">Download size</span>
      <span class="size-value" id="sizeValue">512 px</span>
    </button>

    <div class="logo-picker" role="group" aria-label="Logo">
      <button class="logo-opt is-active" data-logo="none" type="button">None</button>
      <button class="logo-opt" data-logo="logo1" type="button">Logo 1</button>
      <button class="logo-opt" data-logo="logo2" type="button">Logo 2</button>
    </div>

    <button class="btn btn-primary btn-download" id="downloadBtn" type="button">
      <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Download
    </button>

    <button class="settings-toggle" id="settingsToggle" type="button">
      <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Settings
      <svg class="settings-chevron" id="settingsChevron" viewBox="0 0 24 24" width="10" height="10" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="6 9 12 15 18 9"/>
      </svg>
    </button>

    <div class="settings-panel" id="settingsPanel">
      <div class="setting-row">
        <span class="setting-label">Foreground</span>
        <div class="color-controls">
          <input type="text" class="color-text" id="fgColorText" value="#1a1814"
            spellcheck="false" autocomplete="off" maxlength="7" />
          <button class="color-btn" id="fgColorBtn" type="button">
            <div class="color-swatch" id="fgColorSwatch"></div>
          </button>
          <input type="color" id="fgColorWheel" value="#1a1814" class="color-wheel-hidden" />
        </div>
      </div>

      <div class="setting-row">
        <span class="setting-label">Background</span>
        <div class="color-controls">
          <input type="text" class="color-text" id="bgColorText" value="#ffffff"
            spellcheck="false" autocomplete="off" maxlength="7"  />
          <button class="color-btn" id="bgColorBtn" type="button">
            <div class="color-swatch" id="bgColorSwatch"></div>
          </button>
          <input type="color" id="bgColorWheel" value="#ffffff" class="color-wheel-hidden" />
          <label class="transparent-toggle" title="Transparent background">
            <input type="checkbox" id="bgTransparent" />
            <span class="transparent-label">None</span>
          </label>
        </div>
      </div>
    </div>
  </main>

  <script src="qrcode.js"></script>
  <script src="popup.js"></script>
</body>
</html>
